app-id: gg.norisk.NoRiskClientLauncherV3
runtime: org.freedesktop.Platform
runtime-version: "24.08"
sdk: org.freedesktop.Sdk
command: fullrisk-launcher
finish-args:
  - --share=network
  - --share=home
  - --socket=x11
  - --socket=wayland
  - --device=dri
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.Flatpak
modules:
  - name: fullrisk-launcher
    buildsystem: simple
    build-commands:
      - install -Dm755 FullriskLauncher-Linux.AppImage /app/bin/fullrisk-launcher
      - install -Dm644 ../../gg.norisk.NoRiskClientLauncherV3.desktop /app/share/applications/gg.norisk.NoRiskClientLauncherV3.desktop
      - install -Dm644 ../../src-tauri/icons/128x128.png /app/share/icons/hicolor/128x128/apps/gg.norisk.NoRiskClientLauncherV3.png
    sources:
      - type: file
        path: FullriskLauncher-Linux.AppImage
