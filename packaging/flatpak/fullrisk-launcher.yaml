app-id: gg.norisk.NoRiskClientLauncherV3
runtime: org.freedesktop.Platform
runtime-version: "24.08"
sdk: org.freedesktop.Sdk

command: fullrisk-launcher

finish-args:
  - --share=network
  - --share=home
  - --socket=x11
  - --socket=wayland
  - --device=dri
  - --talk-name=org.freedesktop.Notifications

modules:
  - name: fullrisk-launcher
    buildsystem: simple

    build-commands:
      - install -D sources/app.AppImage /app/bin/fullrisk-launcher.AppImage
      - chmod +x /app/bin/fullrisk-launcher.AppImage

    sources:
      - type: file
        path: sources/app.AppImage
