[package]
name = "norisk-capture"
version = "0.1.0"
edition = "2021"
publish = false
description = "Windows game capture, hardware encoding and replay buffer for the NoRisk clip system."

[dependencies]
norisk-ipc = { path = "../norisk-ipc" }
norisk-logging = { path = "../norisk-logging" }
anyhow = "1.0"
log = "0.4"

[target.'cfg(windows)'.dependencies.ffmpeg-next]
version = "8.1"
default-features = false
features = ["codec", "format", "software-resampling"]

[target.'cfg(windows)'.dependencies.tokio]
version = "1.0"
default-features = false
features = ["rt", "net", "io-util", "sync", "time", "macros", "process"]

[target.'cfg(windows)'.dependencies]
windows-core = "0.58"

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "implement",
    "Foundation",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Security",
    "Win32_Devices_FunctionDiscovery",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Performance",
    "Win32_System_IO",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_WindowsAndMessaging",
]

[[bin]]
name = "norisk-capture"
path = "src/bin/norisk_capture.rs"
